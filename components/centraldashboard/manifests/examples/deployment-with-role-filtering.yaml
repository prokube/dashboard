apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dashboard
  name: dashboard
  namespace: kubeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
        sidecar.istio.io/inject: "true"
    spec:
      containers:
      - name: dashboard
        image: ghcr.io/prokube/centraldashboard:role-based-filtering-v1
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 30
        ports:
        - containerPort: 8082
          protocol: TCP
        env:
        - name: USERID_HEADER
          value: kubeflow-userid
        - name: USERID_PREFIX
          value: ""
        - name: PROFILES_KFAM_SERVICE_HOST
          value: profiles-kfam.kubeflow
        - name: PROFILES_KFAM_SERVICE_PORT
          value: "8081"
        - name: REGISTRATION_FLOW
          value: "true"
        - name: DASHBOARD_CONFIGMAP
          value: dashboard-config
        - name: LOGOUT_URL
          value: '/oauth2/sign_out'
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: COLLECT_METRICS
          value: "true"
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
      serviceAccountName: dashboard
