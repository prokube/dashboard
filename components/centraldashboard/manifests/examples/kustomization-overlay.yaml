
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubeflow

resources:
- ../../base

images:
- name: ghcr.io/kubeflow/dashboard/dashboard
  newName: ghcr.io/prokube/centraldashboard
  newTag: role-based-filtering-v1

configMapGenerator:
- name: dashboard-config
  behavior: replace
  files:
  - links=configmap-with-roles.yaml
